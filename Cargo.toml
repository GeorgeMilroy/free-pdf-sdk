[workspace]
resolver = "3"
members = ["crates/core", "crates/viewer", "crates/brand", "tests"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/GeorgeMilroy/free-pdf-sdk"

# pdfcraft is used, never copied. Every pdfcraft crate is pinned to ONE upstream commit; the
# `[patch]` sections below redirect them to the fork's `free-pdf-sdk/patches` branch when the
# SDK needs a hook that pdfcraft does not have yet (see docs/updating-upstream.md).
[workspace.dependencies]
# No `artcraft-marks`: the ArtCraft logos (trademarks) are not compiled into the SDK at all.
pdfcraft-ui-egui = { git = "https://github.com/storytold/pdfcraft", rev = "3109bb2359759e24ef490e1cdbdba00722b20972", default-features = false }
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft", rev = "3109bb2359759e24ef490e1cdbdba00722b20972" }
pdfcraft-xfdf = { git = "https://github.com/storytold/pdfcraft", rev = "3109bb2359759e24ef490e1cdbdba00722b20972" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "3109bb2359759e24ef490e1cdbdba00722b20972" }
pdfcraft-crypt = { git = "https://github.com/storytold/pdfcraft", rev = "3109bb2359759e24ef490e1cdbdba00722b20972" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "3109bb2359759e24ef490e1cdbdba00722b20972" }
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "3109bb2359759e24ef490e1cdbdba00722b20972" }

fps-core = { path = "crates/core", version = "0.2.3" }
fps-brand = { path = "crates/brand", version = "0.2.3" }

eframe = { version = "0.37", default-features = false }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Must match the wasm-bindgen-cli used by scripts/build.ps1 exactly.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The Free PDF SDK patches: every pdfcraft crate comes from the fork's `free-pdf-sdk/patches`
# branch (upstream 6fb6b7cf + the commits listed in docs/architecture.md), at one commit.
# Until that commit is pushed, build with scripts/dev-env.ps1 -LocalFork <clone>.
[patch."https://github.com/storytold/pdfcraft"]
pdfcraft-ui-egui = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
pdfcraft-engine = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
pdfcraft-xfdf = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
pdfcraft-cos = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
pdfcraft-crypt = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
pdfcraft-render = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
pdfcraft-annot = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }

# pdfcraft's own `[patch.crates-io]` is not inherited by git dependents: repeat it, taking the
# vendored crates from the same pdfcraft commit.
[patch.crates-io]
hayro-interpret = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
hayro = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
hayro-syntax = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
hayro-cmap = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
hayro-postscript = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
hayro-jbig2 = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
lopdf = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
vello_common = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
vello_cpu = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "5729cb86d20086c2b104c997728c1abf58a68c57" }
