[workspace]
resolver = "3"
members = ["crates/core", "crates/viewer", "crates/brand", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/GeorgeMilroy/free-pdf-sdk"

# pdfcraft is used, never copied. Every pdfcraft crate is pinned to ONE upstream commit; the
# `[patch]` sections below redirect them to the fork's `free-pdf-sdk/patches` branch when the
# SDK needs a hook that pdfcraft does not have yet (see docs/updating-upstream.md).
[workspace.dependencies]
pdfcraft-ui-egui = { git = "https://github.com/storytold/pdfcraft", rev = "6fb6b7cf6fd8dc105fdd56a764d207cff6140694" }
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft", rev = "6fb6b7cf6fd8dc105fdd56a764d207cff6140694" }
pdfcraft-xfdf = { git = "https://github.com/storytold/pdfcraft", rev = "6fb6b7cf6fd8dc105fdd56a764d207cff6140694" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "6fb6b7cf6fd8dc105fdd56a764d207cff6140694" }
pdfcraft-crypt = { git = "https://github.com/storytold/pdfcraft", rev = "6fb6b7cf6fd8dc105fdd56a764d207cff6140694" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "6fb6b7cf6fd8dc105fdd56a764d207cff6140694" }
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "6fb6b7cf6fd8dc105fdd56a764d207cff6140694" }

fps-core = { path = "crates/core", version = "0.1.0" }
fps-brand = { path = "crates/brand", version = "0.1.0" }

eframe = { version = "0.36", default-features = false }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Must match the wasm-bindgen-cli used by scripts/build.ps1 exactly.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The Free PDF SDK patches: every pdfcraft crate comes from the fork's `free-pdf-sdk/patches`
# branch (upstream 6fb6b7cf + the commits listed in docs/architecture.md), at one commit.
# Until that commit is pushed, build with scripts/dev-env.ps1 -LocalFork <clone>.
[patch."https://github.com/storytold/pdfcraft"]
pdfcraft-ui-egui = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
pdfcraft-engine = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
pdfcraft-xfdf = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
pdfcraft-cos = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
pdfcraft-crypt = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
pdfcraft-render = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
pdfcraft-annot = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }

# pdfcraft's own `[patch.crates-io]` is not inherited by git dependents: repeat it, taking the
# vendored crates from the same pdfcraft commit.
[patch.crates-io]
hayro-interpret = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
hayro = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
hayro-syntax = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
hayro-jbig2 = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
lopdf = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
winit = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
egui-wgpu = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
vello_common = { git = "https://github.com/GeorgeMilroy/pdfcraft", rev = "cef7b907f57d34a62db17946fa6aa5b0239971a4" }
