<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Free PDF SDK</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #19191c; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #19191c; } }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="fps-canvas"></canvas>
    <script type="module">
      // Generated by scripts/build.ps1: the hashed wasm-bindgen glue and module.
      import init from "./{{GLUE_JS}}";
      init({ module_or_path: new URL("./{{WASM}}", import.meta.url) }).catch((e) => console.error("Free PDF SDK: the viewer could not start", e));
    </script>
  </body>
</html>
