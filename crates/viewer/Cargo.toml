[package]
name = "fps-viewer"
description = "Free PDF SDK viewer: pdfcraft compiled to wasm32 with a postMessage RPC server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
fps-core = { workspace = true }

# The viewer only exists in the browser: native builds of the workspace skip egui entirely.
[target.'cfg(target_arch = "wasm32")'.dependencies]
pdfcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Event", "MessageEvent", "EventTarget"] }
